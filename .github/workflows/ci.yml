name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & lint (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A single entry is deliberate: the NIF targets ABI 2.15, which is
        # backward-compatible across the OTP versions we support, so a wider
        # matrix would only re-test the Elixir layer.
        include:
          # Matches the sprite verification environment; the 1.19 formatter
          # disagrees with 1.18 on canonical form, so the format check must
          # run the same line the code is authored against.
          - otp: "27.2"
            elixir: "1.19.2"
    env:
      MIX_ENV: test
      GITILITY_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Check native thread spawn allowlist
        run: scripts/check-thread-spawns.sh

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache mix deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Resolve Rust dependencies
        run: cargo fetch

      - name: Audit gix normal/build features
        run: scripts/check-gix-features.sh

      # The differential oracle is pinned to the exact canonical git in
      # test/differential/GIT_VERSION (the suite hard-fails on a
      # major.minor mismatch — oracle upgrades are deliberate, triaged
      # events). Runners ship whatever git is current, so build the pinned
      # version once and cache it by version.
      - name: Cache pinned canonical git
        id: pinned-git-cache
        uses: actions/cache@v5
        with:
          path: ~/pinned-git
          key: pinned-git-${{ runner.os }}-${{ hashFiles('test/differential/GIT_VERSION') }}

      - name: Build pinned canonical git (oracle)
        if: steps.pinned-git-cache.outputs.cache-hit != 'true'
        run: |
          VERSION="$(cat test/differential/GIT_VERSION)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libexpat1-dev
          # Build outside the checkout: git 2.55+ builds a Rust component,
          # and a source tree nested inside the repo would be claimed by
          # gitility's own cargo workspace ("add to workspace.members").
          cd "$RUNNER_TEMP"
          # Download to a file, then extract: piping curl into tar is not
          # retry-safe (tar dies on the first partial stream). GitHub's tag
          # archive is primary — runner-to-GitHub is the reliable path;
          # kernel.org has flaked twice — with the official dist as fallback.
          # Both extract to git-${VERSION}/.
          curl -fsSL --retry 8 --retry-all-errors --connect-timeout 20 -o git-src.tar.gz \
            "https://github.com/git/git/archive/refs/tags/v${VERSION}.tar.gz" ||
            curl -fsSL --retry 8 --retry-all-errors --connect-timeout 20 -o git-src.tar.gz \
              "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${VERSION}.tar.gz"
          tar -xzf git-src.tar.gz
          make -C "git-${VERSION}" -j"$(nproc)" prefix="$HOME/pinned-git" \
            NO_TCLTK=1 NO_GETTEXT=1 INSTALL_SYMLINKS=1 install

      - name: Use pinned canonical git
        run: |
          echo "$HOME/pinned-git/bin" >> "$GITHUB_PATH"
          "$HOME/pinned-git/bin/git" --version

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (workspace)
        # --all-targets would also execute benches; verify_tax requires the
        # sources/gitoxide dev corpus and hard-fails without it by design.
        run: cargo test --workspace --lib --bins --tests

      - name: Cache loom cargo artifacts
        uses: actions/cache@v5
        with:
          path: target-loom
          key: cargo-loom-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-loom-${{ runner.os }}-

      - name: Loom runtime concurrency tests
        env:
          CARGO_TARGET_DIR: target-loom
          RUSTFLAGS: --cfg loom
        run: |
          set -o pipefail
          cargo test -p gitility-core --release -- \
            --exact \
            runtime::loom_tests::loom_queue_has_no_lost_wakeup \
            runtime::loom_tests::loom_cancel_dequeue_race_has_one_terminal_transition \
            runtime::loom_tests::loom_terminal_state_publishes_output_first \
            runtime::loom_tests::loom_shutdown_submit_race_never_strands_a_job \
            runtime::loom_tests::loom_two_workers_two_jobs_have_no_lost_wakeup \
            runtime::loom_tests::loom_shutdown_races_queued_cancel \
            runtime::loom_tests::loom_double_cancel_from_two_threads_fires_once \
            runtime::loom_tests::loom_shutdown_races_reentrant_shutdown_without_deadlock \
            --test-threads=1 | tee /tmp/gitility-loom-tests.log
          grep -Fq \
            "test result: ok. 8 passed; 0 failed; 0 ignored; 0 measured;" \
            /tmp/gitility-loom-tests.log

      - name: Run tests
        run: mix test

      - name: Build API docs
        # ex_doc is a dev-only dep; the job-level MIX_ENV=test hides it.
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors
