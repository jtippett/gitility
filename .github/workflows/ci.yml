name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & lint (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A single entry is deliberate: the NIF targets ABI 2.15, which is
        # backward-compatible across the OTP versions we support, so a wider
        # matrix would only re-test the Elixir layer.
        include:
          - otp: "27.2"
            elixir: "1.18.0"
    env:
      MIX_ENV: test
      GITILITY_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache mix deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The differential oracle is pinned to the exact canonical git in
      # test/differential/GIT_VERSION (the suite hard-fails on a
      # major.minor mismatch — oracle upgrades are deliberate, triaged
      # events). Runners ship whatever git is current, so build the pinned
      # version once and cache it by version.
      - name: Cache pinned canonical git
        id: pinned-git-cache
        uses: actions/cache@v5
        with:
          path: ~/pinned-git
          key: pinned-git-${{ runner.os }}-${{ hashFiles('test/differential/GIT_VERSION') }}

      - name: Build pinned canonical git (oracle)
        if: steps.pinned-git-cache.outputs.cache-hit != 'true'
        run: |
          VERSION="$(cat test/differential/GIT_VERSION)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libexpat1-dev
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${VERSION}.tar.gz" | tar -xz
          make -C "git-${VERSION}" -j"$(nproc)" prefix="$HOME/pinned-git" \
            NO_TCLTK=1 NO_GETTEXT=1 INSTALL_SYMLINKS=1 install

      - name: Use pinned canonical git
        run: |
          echo "$HOME/pinned-git/bin" >> "$GITHUB_PATH"
          "$HOME/pinned-git/bin/git" --version

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (workspace)
        run: cargo test --workspace --all-targets

      - name: Run tests
        run: mix test

      - name: Build API docs
        run: mix docs --warnings-as-errors
