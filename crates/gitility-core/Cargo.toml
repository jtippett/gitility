[package]
name = "gitility-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Exact pins are deliberate: gitoxide is an internal, pre-1.0 engine (R5).
# Before changing them, run `../../scripts/check-public-api.sh` with
# cargo-public-api installed; its rustdoc JSON input currently needs nightly.
bstr = { version = "=1.13.1", default-features = false, features = ["std"] }
gix-blame = { version = "=0.16.0", default-features = false, features = ["sha1"] }
gix-config = { version = "=0.59.0", default-features = false }
gix-diff = { path = "vendor/gix-diff", version = "=0.66.0", default-features = false, features = ["blob", "sha1", "sha256"] }
gix-glob = { version = "=0.27.0", default-features = false }
gix = { version = "=0.86.0", default-features = false, features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
  "sha1",
] }
gix-hash = { version = "=0.26.0", default-features = false, features = ["sha1", "sha256"] }
gix-object = { version = "=0.63.0", default-features = false, features = ["sha1", "sha256"] }
gix-odb = { version = "=0.83.0", default-features = false, features = ["sha1", "sha256"] }
gix-pack = { version = "=0.73.0", default-features = false }
gix-path = { version = "=0.12.4", default-features = false }
gix-protocol = { version = "=0.64.0", default-features = false }
gix-ref = { version = "=0.66.0", default-features = false, features = ["sha1", "sha256"] }
gix-refspec = { version = "=0.44.0", default-features = false }
gix-revision = { version = "=0.48.0", default-features = false, features = ["merge_base", "sha1"] }
gix-traverse = { version = "=0.60.0", default-features = false, features = ["sha1"] }
gix-worktree = { version = "=0.55.0", default-features = false, features = ["attributes"] }
gix-transport = { version = "=0.58.1", default-features = false }
regex = { version = "=1.13.1", default-features = false, features = ["std"] }
sha1-checked = { version = "=0.10.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
criterion = "=0.7.0"

[target.'cfg(loom)'.dev-dependencies]
loom = "=0.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[[bench]]
name = "verify_tax"
harness = false
