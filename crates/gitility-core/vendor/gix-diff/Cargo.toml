[package]
name = "gix-diff"
version = "0.66.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
# Vendored from upstream gix-diff 0.66.0 (licenses alongside). Every local
# divergence is listed here. Manifest divergences: dependency versions are
# exact `=` pins; crates.io's normalized removal of path dependencies is kept;
# the gix-tempfile edge sets default-features = false so DashMap (hp-hashmap)
# and signal-handler threads cannot enter the NIF; `[lints.clippy]` allows the
# upstream lint surface; and `[lib] test = false` avoids compiling vendor tests.
# Source divergence: tree/function.rs's `#[cfg(test)]` module is removed because
# it requires the omitted gix-testtools dev-dependency. Upgrade by preserving
# the OLD vendor manifest, re-copying `src/` from the new upstream tag, then
# re-applying manifest policy by diffing that old manifest against upstream's
# new manifest and accounting for every delta here. Re-run the complete Rust,
# loom, lint, formatting, spawn-guard, fixture, and differential gate.
#
# Post-1.0 only: the unreachable blob-pipeline surface may be trimmed then;
# keeping it verbatim today minimizes re-vendor drift.
description = "Vendored gitoxide diff (upstream source, thread-free gix-tempfile edge)"

[lib]
path = "src/lib.rs"
doctest = false
test = false

[lints.clippy]
all = "allow"
pedantic = "allow"

[features]
default = ["blob", "index"]
sha1 = ["gix-hash/sha1"]
sha256 = ["gix-hash/sha256"]
blob = [
  "dep:gix-filter",
  "dep:gix-worktree",
  "dep:gix-path",
  "dep:gix-fs",
  "dep:gix-command",
  "dep:gix-tempfile",
  "dep:gix-trace",
  "dep:gix-traverse",
  "dep:imara-diff",
]
index = ["dep:gix-index", "dep:gix-pathspec", "dep:gix-attributes"]
serde = ["dep:serde", "gix-hash/serde", "gix-object/serde", "gix-index?/serde"]
wasm = ["dep:getrandom"]
document-features = ["dep:document-features"]

[dependencies]
bstr = { version = "=1.13.1", default-features = false }
document-features = { version = "0.2.0", optional = true }
getrandom = { version = "0.4", optional = true, default-features = false, features = ["wasm_js"] }
gix-attributes = { version = "=0.34.0", optional = true }
gix-command = { version = "=0.9.2", optional = true }
gix-filter = { version = "=0.33.0", optional = true }
gix-fs = { version = "=0.22.0", optional = true }
gix-hash = { version = "=0.26.0" }
gix-index = { version = "=0.54.0", optional = true }
gix-object = { version = "=0.63.0" }
gix-path = { version = "=0.12.4", optional = true }
gix-pathspec = { version = "=0.19.0", optional = true }
gix-tempfile = { version = "=24.0.0", optional = true, default-features = false }
gix-trace = { version = "=0.1.21", optional = true }
gix-traverse = { version = "=0.60.0", optional = true }
gix-worktree = { version = "=0.55.0", optional = true, default-features = false, features = ["attributes"] }
imara-diff = { package = "gix-imara-diff", version = "=0.2.4", optional = true }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
thiserror = "=2.0.18"
