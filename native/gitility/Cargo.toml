[package]
name = "gitility"
version = "0.1.0"
edition = "2021"
# The shipped NIF is precompiled (CI builds with `stable`), so this only
# constrains rare from-source consumer builds — keep it recent rather than
# artificially low.
rust-version = "1.82"

[lib]
name = "gitility"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
gitility-core = { path = "../../crates/gitility-core" }
